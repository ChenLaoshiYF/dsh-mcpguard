name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

      - name: Rule engine tests (19 cases)
        run: node test/smoke.mjs

      - name: Scanner robustness tests
        run: node test/robust.mjs

      - name: Verify lib is committed and in sync
        run: |
          npm run build
          git diff --exit-code lib/ || echo "::warning::lib/ out of sync with src/ — rebuild and commit"
